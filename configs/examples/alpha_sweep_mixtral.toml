# The expert-granularity test: the same sweep on a model with 8 experts, not 64.
#
# DeepSeek-V2-Lite is close to the least favourable case for seeing a straggler.
# 64 experts over 8 ranks is 8 experts per rank, and averaging 8 loads suppresses
# the imbalance by roughly sqrt(8) before it can reach a rank.
#
# Mixtral 8x7B has 8 experts and top-2. On 8 NPUs that is ONE expert per rank, so
# rank load is expert load with no averaging at all. If expert imbalance ever
# produces a latency cost on this stack, this is the configuration that shows it.
#
# Alpha scales the natural per-layer CV, so the targets mean the same thing they
# did on DeepSeek even though the expert count differs.
#
#   ./nrun -t mixtral 'uv run moe-reliability run configs/examples/alpha_sweep_mixtral.toml'

[experiment]
type = "synthetic_workloads"
name = "mixtral-alpha"
description = "Six alphas on Mixtral 8x7B, 8 NPUs, one expert per rank, profiled."
seed = 43

[model]
model_id = "mistralai/Mixtral-8x7B-Instruct-v0.1"
model_name = "mixtral"

[hardware]
n_npus = 8
visible_devices = "0,1,2,3,4,5,6,7"

[server]
batch_size = 512
enable_expert_parallel = true

[client]
concurrency_limit = 512

[activations]
# Smaller pool than the DeepSeek sweeps: Mixtral has ~12.9B active parameters
# against 2.4B, so capture is correspondingly slower.
n_samples = 1500

[workloads]
target_alphas = [0.5, 0.8, 1.0, 1.3, 1.6, 2.0]
target_prompt_lengths = [300]
length_in_requests = true
prompt_length_tolerance = 0.10
max_repeats = [10]

[benchmark]
workload_max_repeats = 10
workload_prompt_length = 300
repeats = 1
enable_profiling = true
separate_profiling_run = true
trace_active_iterations = 2
save_request_metrics = true

[analysis]
parse_npu_traces = true
trace_summary = true
