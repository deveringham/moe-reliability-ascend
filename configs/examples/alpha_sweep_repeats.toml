# The straggler test: skew expert load without reducing the number of experts.
#
# The forced-imbalance recipe confounds two things. At bias 100 it collapses
# routing onto 6 of 64 experts, and the traces show why that produces no latency
# penalty: rank 0 does 6.7x the GroupedMatmul work of the others, but
# concentrating tokens into 6 large GEMMs instead of 64 small ones drops the
# average call from 112us to 66us, so the busiest rank still does half the work
# of every rank in the balanced case. Efficiency beats the straggler.
#
# max_repeats lets the construction reach a high CV by repeating high-imbalance
# prompts, which reweights the experts instead of eliminating them. That is the
# only way to get a straggler without also handing the kernel a cheaper shape.
#
# Profiling is on, so every point yields per-rank kernel time. The signature to
# look for is rank imbalance in GroupedMatmul rising while its average call time
# stays flat - a straggler with no efficiency confound.
#
#   ./nrun -t repeats 'uv run moe-reliability run configs/examples/alpha_sweep_repeats.toml'

[experiment]
type = "synthetic_workloads"
name = "alpha-repeats"
description = "Six alphas with prompt repeats allowed, profiled, NPUs 0-3."
seed = 43

[model]
model_id = "deepseek-ai/DeepSeek-V2-Lite-Chat"
model_name = "deepseek-v2"

[hardware]
n_npus = 4
# NPUs 4-7 are left for other users on this node.
visible_devices = "0,1,2,3"

[server]
batch_size = 512
enable_expert_parallel = true

[client]
concurrency_limit = 512

[activations]
n_samples = 3000
reuse_activations_from = "20261001-133042_synthetic_deepseek-v2_npu4_bs512_alpha-sweep"

[workloads]
target_alphas = [0.5, 0.8, 1.0, 1.3, 1.6, 2.0]
target_prompt_lengths = [300]
length_in_requests = true
prompt_length_tolerance = 0.10
# Up to 11 selections of the same prompt: amplifies the skew across experts
# without taking any expert out of use.
max_repeats = [10]

[benchmark]
workload_max_repeats = 10
workload_prompt_length = 300
repeats = 1
enable_profiling = true
separate_profiling_run = true
trace_active_iterations = 2
save_request_metrics = true

[analysis]
parse_npu_traces = true
trace_summary = false
