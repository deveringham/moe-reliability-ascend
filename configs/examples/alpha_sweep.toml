# Sweep over synthetic workload imbalance (alpha) on NPUs 0-3.
#
# alpha scales the natural per-layer coefficient of variation of expert load, so
# unlike the forced-imbalance experiment the achieved imbalance is measured
# rather than assumed: every workload records its obtained per-layer CV.
#
# The activation pool is 10x the workload size. The verification run used only
# 3x and could not reach its targets (asking for alpha 0.5 produced 0.86, 1.5
# produced 1.20), because there are not enough candidate prompts to bend the CV
# far from natural.
#
# A workload (300 prompts) is smaller than the batch, so all requests are served
# in one wave. That avoids the bimodal queueing seen with batch 512 and 1000
# prompts, and makes TPOT a clean measure of steady-state decode.
#
#   uv run moe-reliability validate configs/examples/alpha_sweep.toml
#   ./nrun -t alpha 'uv run moe-reliability run configs/examples/alpha_sweep.toml'

[experiment]
type = "synthetic_workloads"
name = "alpha-sweep"
description = "14 alphas from 0.2 to 2.0, 300-prompt workloads from a 3000-prompt pool, NPUs 0-3."
seed = 43

[model]
model_id = "deepseek-ai/DeepSeek-V2-Lite-Chat"
model_name = "deepseek-v2"

[hardware]
n_npus = 4
# NPUs 4-7 are left for other users on this node.
visible_devices = "0,1,2,3"

[server]
batch_size = 512
enable_expert_parallel = true

[client]
concurrency_limit = 512

[activations]
n_samples = 3000

[workloads]
target_alphas = [0.2, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.6, 2.0]
target_prompt_lengths = [300]
max_repeats = [0]

[benchmark]
workload_max_repeats = 0
workload_prompt_length = 300
enable_profiling = false
save_request_metrics = true

[analysis]
parse_npu_traces = false
trace_summary = false
