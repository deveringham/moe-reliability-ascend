# Minimal end-to-end check of the synthetic workload pipeline: a small routed
# expert capture, three alphas, short workloads. Verifies that every stage runs
# before an alpha sweep is worth the NPUs.
#
#   uv run moe-reliability validate configs/examples/synthetic_smoke.toml
#   ./nrun -t swsmoke 'uv run moe-reliability run configs/examples/synthetic_smoke.toml'

[experiment]
type = "synthetic_workloads"
name = "sw-smoke"
seed = 43

[model]
model_id = "deepseek-ai/DeepSeek-V2-Lite-Chat"
model_name = "deepseek-v2"

[hardware]
n_npus = 4
# NPUs 4-7 are left for other users on this node.
visible_devices = "0,1,2,3"

[server]
batch_size = 128

[client]
concurrency_limit = 256

[activations]
n_samples = 300

[workloads]
target_alphas = [0.5, 1.0, 1.5]
target_prompt_lengths = [100]
max_repeats = [0]

[benchmark]
workload_max_repeats = 0
workload_prompt_length = 100
enable_profiling = false
save_request_metrics = true

[analysis]
parse_npu_traces = false
trace_summary = false
