# Forced imbalance dataset over 120 infrastructure configurations on Ascend NPUs:
#   3 NPU counts x 5 batch sizes x expert parallelism on/off           = 30 runs
#   x 4 imbalance levels (simulated straggler severity)                 = 120 sweep points
#
#   uv run moe-reliability grid configs/grids/forced_imbalance_infrastructure.toml --dry-run
#   uv run moe-reliability grid configs/grids/forced_imbalance_infrastructure.toml --continue-on-error
#
# Re-running the command skips completed runs and resumes unfinished ones.
# The three imbalanced checkpoints (about 30 GB each) are written once to imbalance.model_dir
# and shared by all runs.

[grid]
name = "fi-infra"
base = "../examples/forced_imbalance.toml"

[set]
"model.model_id" = "deepseek-ai/DeepSeek-V2-Lite-Chat"
"model.model_name" = "deepseek-v2"
"imbalance.imbalance_levels" = [0, 25, 50, 100]
"benchmark.n_samples" = 2000
"benchmark.enable_profiling" = false

[matrix]
"hardware.n_npus" = [2, 4, 8]
"server.batch_size" = [32, 64, 128, 256, 512]
"server.enable_expert_parallel" = [true, false]
