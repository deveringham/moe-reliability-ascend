# Two follow-ups to the controlled eager sweep, with the instrument in every arm.
#
#   3 runs: graph DeepSeek 5 offsets x 3, graph Mixtral 6 x 3,
#           eager DeepSeek 6 x 3 = 51 points
#
# 1. Graph mode, controlled. rbias-graph-000/001 ran their balanced point
#    without the router-bias plugin, the same confound bias_plugin_at_zero
#    removed from the eager sweeps. Graph mode captures the plugin's add into
#    the graph, so its cost may be small, but it is unmeasured. Offsets match
#    rbias-controlled.
# 2. DeepSeek's threshold. Eager DeepSeek is flat to offset 1 (2.34x) and +22%
#    at offset 2 (3.45x); nothing was swept between. Offsets 1.25 / 1.5 / 1.75
#    fill the gap, with 0 / 1 / 2 as anchors so the comparison stays within one
#    run. Calibrate the new offsets first (rbias-calibration, below).
#
#   ./nrun 'uv run moe-reliability grid configs/grids/router_bias_graph_threshold.toml --dry-run'
#   ./nrun -t rbnext 'uv run moe-reliability run configs/examples/router_bias_calibration.toml \
#       --set "imbalance.imbalance_levels=[1.25, 1.5, 1.75]"; \
#       uv run moe-reliability grid configs/grids/router_bias_graph_threshold.toml'

[grid]
name = "rbias-graph-threshold"
base = "../examples/router_bias_sweep.toml"

[set]
"client.max_new_tokens" = 100
"imbalance.bias_plugin_at_zero" = true

[matrix]
"model.model_id,model.model_name,benchmark.n_samples,imbalance.imbalance_levels,server.enforce_eager" = [
    ["deepseek-ai/DeepSeek-V2-Lite-Chat", "deepseek-v2", 3000, [0, 0.25, 0.5, 1, 2], false],
    ["mistralai/Mixtral-8x7B-Instruct-v0.1", "mixtral", 2000, [0, 0.25, 0.5, 1, 2, 3], false],
    ["deepseek-ai/DeepSeek-V2-Lite-Chat", "deepseek-v2", 3000, [0, 1, 1.25, 1.5, 1.75, 2], true],
]
