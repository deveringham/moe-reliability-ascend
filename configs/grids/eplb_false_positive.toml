# EPLB on against EPLB off, over a skew ladder where only the top level costs.
#
#   2 EPLB settings x 4 levels x 3 repeats = 24 points
#
# The control is the whole experiment. EPLB's cost and its benefit are both
# differences, and on three of the four levels the difference we expect is zero -
# a zero is only readable against a paired arm at the same level, in the same
# session, on the same node. share_workloads puts both arms on identical prompt
# sequences, so rearrangement is the only thing that differs.
#
# What each level is for (loads from the deepseek rbias-calibration run, cost
# from rbias-controlled-000 against its own 2.75% noise floor):
#
#   0      1.14x   benign. Does EPLB rearrange traffic nobody would call skewed?
#   0.5    1.66x   skewed, free (-1.3%). The clearest false positive if it acts.
#   1      2.35x   skewed, free (+1.0%), and above our screen's 1.79x alarm at
#                  margin 0.5 - so this level costs *us* a false positive too,
#                  unless the margin is set to 0. Worth showing both ways.
#   2      3.45x   costly (+22.2%). The level where acting should pay, and the
#                  check that the pipeline can report a real effect.
#
# Reading it:
#   - placement differs from contiguous => EPLB acted
#   - per-layer load falls in the on arm => it reduced the skew it saw
#   - TPOT unchanged at 0, 0.5, 1 while it acted => work bought no latency
#   - TPOT falls at 2 => it works when there is something to win
# If the recorded placement is contiguous at every level, nothing was measured:
# lower server.eplb_heat_collection_interval and re-run before reading anything.
#
# Note on the on arm's routing capture. rank_load assumes contiguous placement,
# so rank_max_over_mean_per_layer is only valid in the off arm. The on arm's
# per-layer load has to be recomputed from the records against the recorded
# placement - the expert ids in the capture are stable, the rank they sit on is
# not. Do not quote the on arm's validation summary directly.
#
#   ./nrun 'uv run moe-reliability grid configs/grids/eplb_false_positive.toml --dry-run'
#   ./nrun -t eplbfp 'uv run moe-reliability grid configs/grids/eplb_false_positive.toml'

[grid]
name = "eplb-fp"
base = "../examples/eplb_false_positive.toml"
share_workloads = true

[matrix]
"server.enable_eplb" = [false, true]
