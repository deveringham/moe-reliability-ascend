[project]
name = "moe-reliability-results"
version = "1.0.0"
description = "Access and visualization library for MoE inference reliability experiment results"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dylan Everingham" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.scripts]
moe-reliability-results = "moe_reliability_results.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_reliability_results"]
